<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Skill Matches | Student Skill Exchange Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <span class="brand-icon-box"><i class="bi bi-arrow-left-right"></i></span>
                <span class="brand-title">Skill<strong>Exchange</strong></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-1">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="matches.html">Find Matches</a></li>
                    <li class="nav-item"><a class="nav-link" href="skills.html">My Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="requests.html">Exchange Proposals</a></li>
                    <li class="nav-item"><a class="nav-link" href="chat.html">Chat</a></li>
                    <li class="nav-item"><a class="nav-link" href="kitaab-ghar.html">Kitaab Ghar</a></li>
                    <li class="nav-item"><a class="nav-link" href="verification.html">Verification</a></li>
                    <li class="nav-item"><a class="nav-link" href="exchange-history.html">History</a></li>
                </ul>
                <div id="navbarUserControls"></div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-4">
        <div id="alertContainer"></div>

        <!-- Search and Filters Bar (Module 5) -->
        <div class="card card-custom p-3 mb-4">
            <div class="row g-2 align-items-center">
                <div class="col-lg-3 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search student or skill..." onkeyup="applyFilters()">
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-grid text-primary-custom"></i></span>
                        <select id="filterCategory" class="form-select" onchange="onCategoryFilterChange()">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-mortarboard text-pink-custom"></i></span>
                        <select id="filterSkill" class="form-select" onchange="applyFilters()">
                            <option value="">All Skills</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-1 col-md-3">
                    <div class="form-check form-switch pt-2">
                        <input class="form-check-input" type="checkbox" id="filterVerified" onchange="applyFilters()">
                        <label class="form-check-label small fw-semibold" for="filterVerified">Verified</label>
                    </div>
                </div>
                <div class="col-lg-2 col-md-3 text-md-end">
                    <button id="btnResetFilters" class="btn btn-outline-secondary btn-sm w-100 py-2" onclick="resetFilters()">
                        <i class="bi bi-arrow-counterclockwise me-1"></i> Clear Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Matching Student Results Grid -->
        <div id="matchesGrid" class="row g-3">
            <div class="col-12 text-center py-5 text-muted">
                <div class="spinner-border spinner-border-sm me-2"></div> Computing student compatibility recommendations...
            </div>
        </div>
    </div>

    <!-- Send Exchange Request Modal -->
    <div class="modal fade" id="requestModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-arrow-left-right me-2 text-primary-custom"></i>Propose Skill Exchange</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="reqReceiverId">
                    <p class="small text-muted mb-3">Send a structured exchange proposal to <strong id="reqReceiverName">Student</strong>.</p>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Skill You Want to Learn from Them *</label>
                        <select id="reqSkillRequested" class="form-select" required></select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Skill You Offer to Teach Them in Return *</label>
                        <select id="reqSkillOffered" class="form-select" required></select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Preferred Learning Mode *</label>
                        <select id="reqLearningMode" class="form-select">
                            <option value="ONLINE">Online Meeting (Google Meet / Zoom)</option>
                            <option value="OFFLINE">Offline Meeting (College Campus / Library)</option>
                            <option value="CHAT">In-built Chat & Notes Exchange</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Introductory Message</label>
                        <textarea id="reqMessage" class="form-control" rows="3" placeholder="Hi! I'd love to exchange skills. I am free on weekday evenings..."></textarea>
                    </div>

                    <button class="btn btn-primary-custom w-100" onclick="submitExchangeRequest()">Send Exchange Proposal</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Report Student Modal -->
    <div class="modal fade" id="reportModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-danger"><i class="bi bi-flag me-2"></i>Report Student Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="reportTargetId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Reason for Report</label>
                        <select id="reportReason" class="form-select">
                            <option value="FAKE_SKILL">Fake Skill or False Claims</option>
                            <option value="INAPPROPRIATE_BEHAVIOR">Inappropriate Behavior</option>
                            <option value="SPAM">Spam or Irrelevant Messages</option>
                            <option value="MISLEADING_PROFILE">Misleading Profile</option>
                            <option value="OTHER">Other Reason</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Explanation / Details</label>
                        <textarea id="reportDesc" class="form-control" rows="3" placeholder="Provide context for admin review..."></textarea>
                    </div>
                    <button class="btn btn-danger w-100" onclick="submitReport()">Submit Report to Admin</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let allMatches = [];
        let allSkillsList = [];
        let allCategoriesList = [];
        let myTeachingSkills = [];

        document.addEventListener("DOMContentLoaded", async () => {
            await initializeFilters();
            await loadMatchesData();
        });

        async function initializeFilters() {
            // 1. Fetch available skill categories dynamically
            const catRes = await API.get('/api/skills/categories');
            if (catRes && catRes.success && Array.isArray(catRes.data)) {
                allCategoriesList = catRes.data;
                const catSelect = document.getElementById('filterCategory');
                catSelect.innerHTML = '<option value="">All Categories</option>' +
                    allCategoriesList.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            }

            // 2. Fetch all available skills dynamically from existing database/API
            const skillRes = await API.get('/api/skills');
            if (skillRes && skillRes.success && Array.isArray(skillRes.data)) {
                allSkillsList = skillRes.data;
                populateSkillDropdown('');
            }

            // 3. Read URL query parameters to pre-apply category / skill / search state
            const params = new URLSearchParams(window.location.search);
            const catParam = params.get('category');
            const skillParam = params.get('skill');
            const qParam = params.get('q') || params.get('search');

            if (catParam) {
                const catSelect = document.getElementById('filterCategory');
                for (let i = 0; i < catSelect.options.length; i++) {
                    if (catSelect.options[i].value.toLowerCase() === catParam.toLowerCase()) {
                        catSelect.selectedIndex = i;
                        populateSkillDropdown(catSelect.options[i].value);
                        break;
                    }
                }
            }

            if (skillParam) {
                const skillSelect = document.getElementById('filterSkill');
                for (let i = 0; i < skillSelect.options.length; i++) {
                    if (skillSelect.options[i].value.toLowerCase() === skillParam.toLowerCase()) {
                        skillSelect.selectedIndex = i;
                        break;
                    }
                }
            }

            if (qParam) {
                document.getElementById('searchInput').value = qParam;
            }
        }

        function populateSkillDropdown(selectedCategoryName = '') {
            const skillSelect = document.getElementById('filterSkill');
            const previousVal = skillSelect ? skillSelect.value : '';

            let filteredSkills = allSkillsList;
            if (selectedCategoryName) {
                filteredSkills = allSkillsList.filter(s => {
                    const cat = s.categoryName || '';
                    return cat.toLowerCase() === selectedCategoryName.toLowerCase();
                });
            }

            skillSelect.innerHTML = '<option value="">All Skills</option>' +
                filteredSkills.map(s => {
                    const name = s.name || s.skillName;
                    return `<option value="${name}">${name}</option>`;
                }).join('');

            // Restore previous value if still available in current filter list
            if (previousVal) {
                for (let i = 0; i < skillSelect.options.length; i++) {
                    if (skillSelect.options[i].value.toLowerCase() === previousVal.toLowerCase()) {
                        skillSelect.selectedIndex = i;
                        break;
                    }
                }
            }
        }

        function onCategoryFilterChange() {
            const selectedCat = document.getElementById('filterCategory').value;
            populateSkillDropdown(selectedCat);
            applyFilters();
        }

        async function loadMatchesData() {
            // Load user profile & teaching skills if logged in
            const profRes = await API.get('/api/students/profile/me');
            if (profRes && profRes.success && profRes.data) {
                myTeachingSkills = profRes.data.teachingSkills || [];
            }

            // Load algorithm matches and candidate opportunities
            const res = await API.get('/api/matches');
            if (res && res.success && Array.isArray(res.data)) {
                allMatches = res.data;
                applyFilters();
            } else {
                document.getElementById('matchesGrid').innerHTML = `
                    <div class="col-12 text-center py-5 text-muted">
                        <i class="bi bi-exclamation-triangle fs-1 d-block mb-2 text-warning"></i>
                        <h5>Unable to load student exchanges</h5>
                        <p class="text-muted small">Please verify the application server is running.</p>
                    </div>
                `;
            }
        }

        function applyFilters() {
            const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const selectedCat = (document.getElementById('filterCategory').value || '').trim().toLowerCase();
            const selectedSkill = (document.getElementById('filterSkill').value || '').trim().toLowerCase();
            const verifiedOnly = document.getElementById('filterVerified').checked;

            const filtered = allMatches.filter(m => {
                // Search query matching (student name, skills, department)
                const nameMatch = (m.studentName || '').toLowerCase().includes(q);
                const teachMatch = (m.skillTheyTeachYou || '').toLowerCase().includes(q);
                const learnMatch = (m.skillYouTeachThem || '').toLowerCase().includes(q);
                const deptMatch = (m.department || '').toLowerCase().includes(q);
                const listTeachMatch = (m.teachingSkills || []).some(s => (s.skillName || s.name || '').toLowerCase().includes(q));
                const listLearnMatch = (m.learningSkills || []).some(s => (s.skillName || s.name || '').toLowerCase().includes(q));
                const matchesQuery = !q || nameMatch || teachMatch || learnMatch || deptMatch || listTeachMatch || listLearnMatch;

                // Category filter matching
                let matchesCategory = true;
                if (selectedCat) {
                    const primaryCat = (m.categoryName || '').toLowerCase() === selectedCat;
                    const inCatsList = (m.categories || []).some(c => (c || '').toLowerCase() === selectedCat);
                    const inTeachCats = (m.teachingSkills || []).some(s => (s.categoryName || '').toLowerCase() === selectedCat);
                    const inLearnCats = (m.learningSkills || []).some(s => (s.categoryName || '').toLowerCase() === selectedCat);
                    matchesCategory = primaryCat || inCatsList || inTeachCats || inLearnCats;
                }

                // Skill filter matching
                let matchesSkill = true;
                if (selectedSkill) {
                    const teachSkill = (m.skillTheyTeachYou || '').toLowerCase() === selectedSkill;
                    const learnSkill = (m.skillYouTeachThem || '').toLowerCase() === selectedSkill;
                    const inTeach = (m.teachingSkills || []).some(s => (s.skillName || s.name || '').toLowerCase() === selectedSkill);
                    const inLearn = (m.learningSkills || []).some(s => (s.skillName || s.name || '').toLowerCase() === selectedSkill);
                    matchesSkill = teachSkill || learnSkill || inTeach || inLearn;
                }

                // Verified filter matching
                const matchesVerified = !verifiedOnly || m.verified;

                return matchesQuery && matchesCategory && matchesSkill && matchesVerified;
            });

            renderMatches(filtered);

            // Update URL search parameters without page reload
            const currentUrl = new URL(window.location);
            const actualCat = document.getElementById('filterCategory').value;
            const actualSkill = document.getElementById('filterSkill').value;
            const actualQ = document.getElementById('searchInput').value.trim();

            if (actualCat) currentUrl.searchParams.set('category', actualCat);
            else currentUrl.searchParams.delete('category');

            if (actualSkill) currentUrl.searchParams.set('skill', actualSkill);
            else currentUrl.searchParams.delete('skill');

            if (actualQ) currentUrl.searchParams.set('q', actualQ);
            else currentUrl.searchParams.delete('q');

            window.history.replaceState({}, '', currentUrl.toString());
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterCategory').value = '';
            populateSkillDropdown('');
            document.getElementById('filterSkill').value = '';
            document.getElementById('filterVerified').checked = false;

            // Clear URL query parameters
            window.history.replaceState({}, '', window.location.pathname);

            renderMatches(allMatches);
        }

        function renderMatches(matches) {
            const container = document.getElementById('matchesGrid');
            if (matches.length === 0) {
                const currentSkill = document.getElementById('filterSkill').value;
                const currentCat = document.getElementById('filterCategory').value;
                const currentQ = document.getElementById('searchInput').value.trim();

                let emptyTitle = "No skill exchange opportunities found for this skill.";
                if (!currentSkill && currentCat) {
                    emptyTitle = `No skill exchange opportunities found in ${currentCat}.`;
                } else if (!currentSkill && !currentCat && currentQ) {
                    emptyTitle = `No students or skills found matching "${currentQ}".`;
                }

                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="card card-custom p-5 mx-auto bg-white" style="max-width: 580px;">
                            <div class="mx-auto mb-3 p-3 border border-2 border-dark rounded bg-light text-dark d-flex align-items-center justify-content-center" style="width: 64px; height: 64px; box-shadow: 2px 2px 0px var(--border-color);">
                                <i class="bi bi-search fs-3"></i>
                            </div>
                            <h4 class="fw-bold text-dark mb-2 text-uppercase">${emptyTitle}</h4>
                            <p class="text-muted small mb-4">No student exchange matches found with your current filter criteria.</p>
                            <div>
                                <button class="btn btn-primary-custom px-4 py-2" onclick="resetFilters()">
                                    <i class="bi bi-arrow-counterclockwise me-1"></i> View All Skills
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = matches.map(m => `
                <div class="col-md-6 col-lg-4">
                    <div class="card card-custom p-4 h-100 d-flex flex-column justify-content-between bg-white">
                        <div>
                            <!-- Header with avatar, badge, and match percentage -->
                            <div class="d-flex justify-content-between align-items-start mb-3 pb-2 border-bottom border-2 border-dark">
                                <div class="d-flex align-items-center gap-3">
                                    <img src="${m.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + m.userId}" class="avatar-img" alt="${m.studentName}">
                                    <div>
                                        <h5 class="fw-bold mb-0 text-dark">${m.studentName}</h5>
                                        <div class="small text-dark fw-bold mt-1" style="font-family: var(--font-mono);">
                                            Rating: ${(m.averageRating || 0).toFixed(1)} / 5
                                        </div>
                                    </div>
                                </div>
                                <span class="match-score-badge">${m.matchPercentage}%</span>
                            </div>

                            <!-- Verification Badge -->
                            ${(m.skillTheyTeachYouVerified || m.verified) ? `
                            <div class="mb-2">
                                <span class="badge badge-verified"><i class="bi bi-patch-check-fill me-1"></i>✓ Verified Skill</span>
                            </div>
                            ` : ''}

                            <!-- Skills Exchange Offer Details -->
                            <div class="p-3 rounded mb-3 border border-2 border-dark" style="background-color: var(--canvas-bg);">
                                <div class="mb-2">
                                    <span class="text-muted small d-block fw-bold text-uppercase" style="font-size:0.68rem;">They Can Teach:</span>
                                    <div class="d-flex align-items-center gap-1 flex-wrap">
                                        <strong class="text-dark fs-6"><i class="bi bi-mortarboard me-1 text-primary"></i>${m.skillTheyTeachYou}</strong>
                                        ${m.skillTheyTeachYouVerified ? '<span class="badge badge-verified ms-1" style="font-size:0.68rem;"><i class="bi bi-patch-check-fill me-1"></i>✓ Verified</span>' : ''}
                                    </div>
                                </div>
                                ${m.skillYouTeachThem ? `
                                <div>
                                    <span class="text-muted small d-block fw-bold text-uppercase" style="font-size:0.68rem;">They Want to Learn:</span>
                                    <strong class="text-dark fs-6"><i class="bi bi-lightbulb me-1 text-danger"></i>${m.skillYouTeachThem}</strong>
                                    ${m.isMutualMatch ? '<span class="badge badge-mutual ms-1">2-Way Mutual Barter</span>' : ''}
                                </div>
                                ` : ''}
                            </div>

                            <!-- Algorithm Explainable Breakdown -->
                            <div class="mb-3">
                                <span class="section-tag-light px-2 py-1 mb-1 d-inline-block small" style="font-size:0.68rem;">Match Breakdown</span>
                                <p class="small text-muted mb-0" style="font-size:0.8rem; line-height:1.45;">${m.matchReason}</p>
                            </div>
                        </div>

                        <!-- Card Action Buttons -->
                        <div class="d-flex gap-2 pt-3 border-top border-2 border-dark">
                            <button class="btn btn-primary-custom flex-grow-1" onclick="openRequestModal(${m.userId}, '${m.studentName}', '${m.skillTheyTeachYou}', ${m.skillTheyTeachYouId || 'null'}, '${m.skillYouTeachThem || ''}', ${m.skillYouTeachThemId || 'null'})">
                                <i class="bi bi-send me-1"></i> Propose Exchange
                            </button>
                            <button class="btn btn-outline-danger btn-sm" title="Report Student" onclick="openReportModal(${m.userId})">
                                <i class="bi bi-flag"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openRequestModal(receiverId, receiverName, skillRequestedName, skillRequestedId, skillOfferedName, skillOfferedId) {
            if (!CurrentUser) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById('reqReceiverId').value = receiverId;
            document.getElementById('reqReceiverName').innerText = receiverName;

            // Requested Skill dropdown
            const reqSelect = document.getElementById('reqSkillRequested');
            if (skillRequestedId) {
                reqSelect.innerHTML = `<option value="${skillRequestedId}" selected>${skillRequestedName}</option>`;
            } else {
                reqSelect.innerHTML = `<option value="1">General Mentoring</option>`;
            }

            // Offered Skill dropdown
            const offSelect = document.getElementById('reqSkillOffered');
            if (myTeachingSkills.length > 0) {
                offSelect.innerHTML = myTeachingSkills.map(ts => `
                    <option value="${ts.skillId}" ${ts.skillId === skillOfferedId ? 'selected' : ''}>${ts.skillName} (${ts.levelOrUrgency})</option>
                `).join('');
            } else {
                offSelect.innerHTML = `<option value="" disabled selected>You have not added any skills you can teach!</option>`;
            }

            new bootstrap.Modal(document.getElementById('requestModal')).show();
        }

        async function submitExchangeRequest() {
            const receiverId = document.getElementById('reqReceiverId').value;
            const skillRequestedId = document.getElementById('reqSkillRequested').value;
            const skillOfferedId = document.getElementById('reqSkillOffered').value;
            const learningMode = document.getElementById('reqLearningMode').value;
            const message = document.getElementById('reqMessage').value.trim();

            if (!skillOfferedId) {
                alert("Please add at least one skill you can teach from the 'My Skills' page first!");
                return;
            }

            const payload = {
                receiverId: Number(receiverId),
                skillRequestedId: Number(skillRequestedId),
                skillOfferedId: Number(skillOfferedId),
                learningMode: learningMode,
                message: message || "Hello! I would love to exchange skills with you."
            };

            const res = await API.post('/api/exchange-requests', payload);
            if (res && res.success) {
                bootstrap.Modal.getInstance(document.getElementById('requestModal')).hide();
                showAlert("Skill exchange proposal dispatched successfully! You can track responses in 'Exchange Proposals'.", "success");
            } else {
                alert(res.message || "Failed to send proposal");
            }
        }

        function openReportModal(targetUserId) {
            document.getElementById('reportTargetId').value = targetUserId;
            new bootstrap.Modal(document.getElementById('reportModal')).show();
        }

        async function submitReport() {
            const reportedUserId = document.getElementById('reportTargetId').value;
            const reason = document.getElementById('reportReason').value;
            const description = document.getElementById('reportDesc').value.trim();

            if (!description) {
                alert("Please explain the issue");
                return;
            }

            const res = await API.post('/api/reports', {
                reportedUserId: Number(reportedUserId),
                reason,
                description
            });

            if (res && res.success) {
                bootstrap.Modal.getInstance(document.getElementById('reportModal')).hide();
                showAlert("Report submitted to administrator for audit.", "info");
            } else {
                alert(res.message || "Failed to submit report");
            }
        }
    </script>
</body>
</html>
