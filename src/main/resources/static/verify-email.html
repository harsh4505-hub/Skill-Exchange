<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify College Email | Student Skill Exchange Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .otp-input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 1.5rem 0;
        }
        .otp-digit {
            width: 48px;
            height: 56px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            font-family: var(--font-mono);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: #ffffff;
            box-shadow: 2px 2px 0 var(--border-color);
        }
        .otp-digit:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 3px 3px 0 var(--border-color);
        }
    </style>
</head>
<body class="bg-light">

    <!-- Minimal Navbar Header -->
    <nav class="navbar navbar-custom py-3 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="index.html">
                <span class="brand-icon-box"><i class="bi bi-arrow-left-right"></i></span>
                <span class="brand-title">SkillExchange</span>
            </a>
            <a href="login.html" class="btn btn-outline-custom btn-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Back to Login
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div id="alertContainer"></div>

                <div class="card card-custom p-4 p-md-5 text-center">
                    <div class="stat-icon-box mx-auto mb-3" style="width: 58px; height: 58px; background: var(--canvas-bg);">
                        <i class="bi bi-envelope-check-fill fs-3 text-dark"></i>
                    </div>

                    <div class="text-uppercase fw-bold text-muted small mb-1" style="font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em;">Email Security Verification</div>
                    <h3 class="fw-bold mb-2">Verify Your Email</h3>
                    <p class="text-muted small mb-3">
                        We sent a 6-digit confirmation code to your email address:<br>
                        <strong class="text-dark font-monospace" id="displayEmail">student@gmail.com</strong>
                    </p>

                    <form id="verifyOtpForm" onsubmit="handleVerifyOtp(event)">
                        <div class="otp-input-group" id="otpContainer">
                            <input type="text" class="otp-digit" maxlength="1" id="otp1" inputmode="numeric" pattern="[0-9]*" required autocomplete="off">
                            <input type="text" class="otp-digit" maxlength="1" id="otp2" inputmode="numeric" pattern="[0-9]*" required autocomplete="off">
                            <input type="text" class="otp-digit" maxlength="1" id="otp3" inputmode="numeric" pattern="[0-9]*" required autocomplete="off">
                            <input type="text" class="otp-digit" maxlength="1" id="otp4" inputmode="numeric" pattern="[0-9]*" required autocomplete="off">
                            <input type="text" class="otp-digit" maxlength="1" id="otp5" inputmode="numeric" pattern="[0-9]*" required autocomplete="off">
                            <input type="text" class="otp-digit" maxlength="1" id="otp6" inputmode="numeric" pattern="[0-9]*" required autocomplete="off">
                        </div>

                        <button type="submit" id="verifyBtn" class="btn btn-primary-custom w-100 py-2 mb-3">
                            <i class="bi bi-check2-circle me-1"></i> Verify & Activate Account
                        </button>
                    </form>

                    <div class="border-top pt-3 mt-2" style="border-color: var(--border-color) !important;">
                        <p class="small text-muted mb-2">Didn't receive the email code?</p>
                        <button type="button" id="resendBtn" class="btn btn-outline-custom btn-sm" onclick="handleResendOtp()">
                            <i class="bi bi-arrow-repeat me-1"></i> Resend Verification Code
                        </button>
                        <div id="cooldownText" class="small text-muted mt-2" style="font-family: var(--font-mono); font-size: 0.75rem;"></div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <small class="text-muted">Official college domain policy enforced: <strong>@mgmmumbai.ac.in</strong></small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentEmail = '';
        let cooldownSeconds = 0;
        let cooldownTimer = null;

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentEmail = urlParams.get('email') || sessionStorage.getItem('pendingVerificationEmail') || '';

            if (currentEmail) {
                document.getElementById('displayEmail').innerText = currentEmail;
            }

            setupOtpInputFields();
        });

        function setupOtpInputFields() {
            const inputs = [
                document.getElementById('otp1'),
                document.getElementById('otp2'),
                document.getElementById('otp3'),
                document.getElementById('otp4'),
                document.getElementById('otp5'),
                document.getElementById('otp6')
            ];

            inputs.forEach((input, index) => {
                input.addEventListener('focus', () => {
                    input.select();
                });

                input.addEventListener('input', (e) => {
                    const cleaned = e.target.value.replace(/[^0-9]/g, '');
                    e.target.value = cleaned;

                    if (cleaned.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (!e.target.value && index > 0) {
                            inputs[index - 1].focus();
                            inputs[index - 1].value = '';
                        }
                    } else if (e.key === 'ArrowLeft' && index > 0) {
                        inputs[index - 1].focus();
                    } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const text = (e.clipboardData || window.clipboardData).getData('text').trim();
                    const digits = text.replace(/[^0-9]/g, '');

                    if (digits.length >= 6) {
                        for (let i = 0; i < 6; i++) {
                            inputs[i].value = digits[i];
                        }
                        inputs[5].focus();
                    } else if (digits.length > 0) {
                        for (let i = 0; i < digits.length && (index + i) < inputs.length; i++) {
                            inputs[index + i].value = digits[i];
                        }
                        const nextIndex = Math.min(index + digits.length, inputs.length - 1);
                        inputs[nextIndex].focus();
                    }
                });
            });

            if (inputs[0]) {
                inputs[0].focus();
            }
        }

        async function handleVerifyOtp(e) {
            e.preventDefault();
            const otp = [1, 2, 3, 4, 5, 6].map(i => document.getElementById(`otp${i}`).value).join('');

            if (otp.length !== 6 || !/^\d{6}$/.test(otp)) {
                showAlert("Please enter all 6 digits of the confirmation code.", "danger");
                return;
            }

            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Verifying...`;

            try {
                const res = await API.post('/api/auth/verify-email', {
                    email: currentEmail,
                    otp: otp
                });

                if (res && res.success) {
                    showAlert("College email verified successfully! Your account is activated. Redirecting to login...", "success");
                    sessionStorage.removeItem('pendingVerificationEmail');
                    setTimeout(() => {
                        window.location.href = 'login.html?verified=true';
                    }, 1500);
                } else {
                    showAlert(res.message || "Invalid or expired verification code.", "danger");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="bi bi-check2-circle me-1"></i> Verify & Activate Account`;
                }
            } catch (err) {
                showAlert("Error verifying code. Please try again.", "danger");
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-check2-circle me-1"></i> Verify & Activate Account`;
            }
        }

        async function handleResendOtp() {
            if (cooldownSeconds > 0) return;

            const resendBtn = document.getElementById('resendBtn');
            resendBtn.disabled = true;
            resendBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Sending...`;

            try {
                const res = await API.post('/api/auth/resend-otp', { email: currentEmail });
                if (res && res.success) {
                    showAlert("A fresh verification code has been dispatched to your official college inbox.", "info");
                    startCooldown(60);
                } else {
                    showAlert(res.message || "We couldn't send the verification email. Please try again.", "danger");
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = `<i class="bi bi-arrow-repeat me-1"></i> Resend Verification Code`;
                }
            } catch (err) {
                showAlert("We couldn't send the verification email. Please try again.", "danger");
                resendBtn.disabled = false;
                resendBtn.innerHTML = `<i class="bi bi-arrow-repeat me-1"></i> Resend Verification Code`;
            }
        }

        function startCooldown(seconds) {
            cooldownSeconds = seconds;
            const resendBtn = document.getElementById('resendBtn');
            const cooldownText = document.getElementById('cooldownText');
            resendBtn.disabled = true;

            if (cooldownTimer) clearInterval(cooldownTimer);

            cooldownTimer = setInterval(() => {
                cooldownSeconds--;
                if (cooldownSeconds <= 0) {
                    clearInterval(cooldownTimer);
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = `<i class="bi bi-arrow-repeat me-1"></i> Resend Verification Code`;
                    cooldownText.innerText = '';
                } else {
                    cooldownText.innerText = `Request new code in ${cooldownSeconds}s`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
