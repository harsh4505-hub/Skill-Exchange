<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Student Skill Exchange Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="brand-icon-box"><i class="bi bi-arrow-left-right"></i></span>
                <span class="brand-title">Skill<strong>Exchange</strong></span>
            </a>
            <div class="ms-auto">
                <a href="login.html" class="btn btn-outline-custom btn-sm">Already Registered? Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div id="alertContainer"></div>

                <div class="card card-custom p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="section-tag mb-1">MEMBERSHIP</span>
                        <h2 class="fw-bold mb-1">CREATE STUDENT ACCOUNT</h2>
                        <p class="text-muted small">Register with your official university credentials to start trading skills</p>
                    </div>

                    <form id="registerForm" onsubmit="handleRegister(event)">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                                <input type="text" id="fullName" class="form-control" placeholder="e.g. Rahul Sharma" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">College Email <span class="text-danger">*</span></label>
                                <input type="email" id="email" class="form-control" placeholder="rahul@mgmmumbai.ac.in" required>
                                <small class="text-muted" style="font-size:0.75rem;">Must end with @mgmmumbai.ac.in</small>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">College / Institute <span class="text-danger">*</span></label>
                                <input type="text" id="college" class="form-control" placeholder="e.g. College of Engineering & Tech" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Department <span class="text-danger">*</span></label>
                                <select id="department" class="form-select" required>
                                    <option value="" disabled selected>Select Department</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Computer Science">Computer Science & Engineering</option>
                                    <option value="Electronics & Comm">Electronics & Communication</option>
                                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                                    <option value="Civil Engineering">Civil Engineering</option>
                                    <option value="Management Studies">Management Studies</option>
                                    <option value="Other">Other Department</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Year of Study <span class="text-danger">*</span></label>
                                <select id="yearOfStudy" class="form-select" required>
                                    <option value="" disabled selected>Select Year</option>
                                    <option value="1st Year">1st Year (Freshman)</option>
                                    <option value="2nd Year" selected>2nd Year (Sophomore)</option>
                                    <option value="3rd Year">3rd Year (Junior)</option>
                                    <option value="4th Year">4th Year (Senior)</option>
                                    <option value="Postgraduate">Postgraduate</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" id="phone" class="form-control" placeholder="e.g. 9876543210">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Password <span class="text-danger">*</span></label>
                                <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
                                <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
                            </div>
                        </div>

                        <div class="form-check mt-4 mb-4">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label small text-muted" for="termsCheck">
                                I agree to the <a href="javascript:void(0)" class="fw-bold text-dark text-decoration-underline">Community Guidelines</a> and verify that I am an actively enrolled college student.
                            </label>
                        </div>

                        <button type="submit" id="regBtn" class="btn btn-primary-custom w-100 py-2 fs-6">
                            <i class="bi bi-person-check-fill me-2"></i>Complete Student Registration
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted small">Already have an account? </span>
                        <a href="login.html" class="small fw-bold text-dark text-decoration-underline">Sign in here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const email = (emailInput.value || '').trim();

            // Enforce official college domain ending with @mgmmumbai.ac.in
            const collegeEmailPattern = /^[a-zA-Z0-9._%+-]+@mgmmumbai\.ac\.in$/i;
            if (!collegeEmailPattern.test(email)) {
                showAlert("Please use your official college email address ending with @mgmmumbai.ac.in.", "danger");
                emailInput.focus();
                return;
            }

            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (pwd !== confirm) {
                showAlert("Password and Confirm Password do not match!", "danger");
                return;
            }

            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...`;

            const payload = {
                fullName: document.getElementById('fullName').value.trim(),
                email: email,
                password: pwd,
                confirmPassword: confirm,
                college: document.getElementById('college').value.trim(),
                department: document.getElementById('department').value,
                yearOfStudy: document.getElementById('yearOfStudy').value,
                phone: document.getElementById('phone').value.trim()
            };

            const res = await API.post('/api/auth/register', payload);
            if (res && res.success) {
                if (res.requiresVerification) {
                    sessionStorage.setItem('pendingVerificationEmail', email);
                    if (res.simulatedOtp) {
                        sessionStorage.setItem('simulatedOtp', res.simulatedOtp);
                    }
                    showAlert("Registration initiated! Redirecting to email verification...", "success");
                    setTimeout(() => {
                        window.location.href = `verify-email.html?email=${encodeURIComponent(email)}&otp=${res.simulatedOtp || ''}`;
                    }, 1000);
                } else {
                    showAlert("Account successfully created! Redirecting to your dashboard...", "success");
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                }
            } else {
                showAlert(res.message || "Registration failed. Please check your details.", "danger");
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-person-check-fill me-2"></i>Complete Student Registration`;
            }
        }
    </script>
</body>
</html>
