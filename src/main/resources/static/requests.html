<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Proposals | Student Skill Exchange Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="brand-icon-box"><i class="bi bi-arrow-left-right"></i></span>
                <span class="brand-title">Skill<strong>Exchange</strong></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-1">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="matches.html">Find Matches</a></li>
                    <li class="nav-item"><a class="nav-link" href="skills.html">My Skills</a></li>
                    <li class="nav-item"><a class="nav-link active" href="requests.html">Exchange Proposals</a></li>
                    <li class="nav-item"><a class="nav-link" href="chat.html">Chat</a></li>
                    <li class="nav-item"><a class="nav-link" href="verification.html">Verification</a></li>
                    <li class="nav-item"><a class="nav-link" href="exchange-history.html">History</a></li>
                </ul>
                <div id="navbarUserControls"></div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-4">
        <div id="alertContainer"></div>

        <!-- Tabs: Incoming vs Outgoing -->
        <ul class="nav nav-pills mb-4 gap-2">
            <li class="nav-item">
                <button class="nav-link active px-4" data-bs-toggle="pill" data-bs-target="#incomingTab" onclick="loadRequests()">
                    <i class="bi bi-inbox me-2"></i>Incoming Requests <span id="incomingBadge" class="badge bg-light text-dark ms-1">0</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link px-4" data-bs-toggle="pill" data-bs-target="#outgoingTab" onclick="loadRequests()">
                    <i class="bi bi-send me-2"></i>Sent Proposals <span id="outgoingBadge" class="badge bg-light text-dark ms-1">0</span>
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Incoming Requests Tab -->
            <div class="tab-pane fade show active" id="incomingTab">
                <div class="card card-custom p-4 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-2 border-dark">
                        <h5 class="fw-bold mb-0 text-dark">Incoming Proposals</h5>
                        <small class="text-muted">Proposals sent to you by campus peers</small>
                    </div>
                    <div id="incomingContainer" class="d-flex flex-column gap-3">
                        <div class="text-center py-4 text-muted small">Loading requests...</div>
                    </div>
                </div>
            </div>

            <!-- Outgoing Proposals Tab -->
            <div class="tab-pane fade" id="outgoingTab">
                <div class="card card-custom p-4 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-2 border-dark">
                        <h5 class="fw-bold mb-0 text-dark">Proposals You Sent</h5>
                        <small class="text-muted">Invitations you sent out to potential partners</small>
                    </div>
                    <div id="outgoingContainer" class="d-flex flex-column gap-3">
                        <div class="text-center py-4 text-muted small">Loading sent requests...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await loadRequests();
        });

        async function loadRequests() {
            const res = await API.get('/api/exchange-requests');
            if (res && res.success) {
                const myId = CurrentUser ? CurrentUser.userId : null;
                const incoming = res.data.filter(r => r.receiverId === myId);
                const outgoing = res.data.filter(r => r.senderId === myId);

                document.getElementById('incomingBadge').innerText = incoming.filter(r => r.status === 'PENDING').length;
                document.getElementById('outgoingBadge').innerText = outgoing.length;

                renderIncoming(incoming);
                renderOutgoing(outgoing);
            }
        }

        function getStatusBadge(status) {
            switch (status) {
                case 'ACCEPTED': return 'badge-verified';
                case 'COMPLETED': return 'bg-success text-white';
                case 'REJECTED': return 'bg-danger text-white';
                case 'PENDING':
                default: return 'bg-warning text-dark';
            }
        }

        function renderIncoming(requests) {
            const container = document.getElementById('incomingContainer');
            if (requests.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-muted small">No incoming exchange requests at this time.</div>`;
                return;
            }

            container.innerHTML = requests.map(r => `
                <div class="card card-custom p-3 bg-white">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2 pb-2 border-bottom border-1 border-dark">
                        <div>
                            <h6 class="mb-0 fw-bold text-dark"><i class="bi bi-person me-1 text-primary"></i>${r.senderName} (${r.senderEmail})</h6>
                            <p class="mb-0 small text-muted">Proposed on ${new Date(r.createdAt).toLocaleDateString()}</p>
                        </div>
                        <span class="badge ${getStatusBadge(r.status)} px-3 py-1">${r.status}</span>
                    </div>

                    <!-- Skills & Learning Mode -->
                    <div class="row g-2 p-2 rounded mb-2 small border border-2 border-dark" style="background-color: var(--canvas-bg);">
                        <div class="col-sm-5">
                            <span class="text-muted d-block fw-bold text-uppercase" style="font-size:0.68rem;">They Offer:</span>
                            <strong class="text-dark fs-6">${r.skillOfferedName}</strong>
                            ${r.skillOfferedVerified ? '<span class="badge badge-verified ms-1" style="font-size:0.68rem;"><i class="bi bi-patch-check-fill me-1"></i>✓ Verified</span>' : ''}
                        </div>
                        <div class="col-sm-2 text-center text-dark fw-bold d-flex align-items-center justify-content-center">FOR</div>
                        <div class="col-sm-5 text-sm-end">
                            <span class="text-muted d-block fw-bold text-uppercase" style="font-size:0.68rem;">They Want from You:</span>
                            <strong class="text-dark fs-6">${r.skillRequestedName}</strong>
                        </div>
                    </div>

                    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mt-2">
                        <div>
                            <span class="badge badge-${r.learningMode.toLowerCase()} me-2">Mode: ${r.learningMode}</span>
                            <span class="small text-muted fst-italic">"${r.message || 'No note added'}"</span>
                        </div>

                        <div class="d-flex gap-2">
                            ${r.status === 'PENDING' ? `
                                <button class="btn btn-sm btn-success px-3" onclick="acceptProposal(${r.id})">
                                    <i class="bi bi-check2 me-1"></i> Accept
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="rejectProposal(${r.id})">
                                    <i class="bi bi-x me-1"></i> Decline
                                </button>
                            ` : ''}

                            ${r.status === 'ACCEPTED' ? `
                                <a href="chat.html?partnerId=${r.senderId}" class="btn btn-sm btn-primary-custom">
                                    <i class="bi bi-chat-dots me-1"></i> Open Chat
                                </a>
                                <button class="btn btn-sm btn-outline-custom" onclick="completeProposal(${r.id})">
                                    <i class="bi bi-check2-all me-1"></i> Mark Completed
                                </button>
                            ` : ''}

                            ${r.status === 'COMPLETED' ? `
                                <a href="exchange-history.html" class="btn btn-sm btn-outline-custom">
                                    <i class="bi bi-star me-1 text-warning"></i> Rate Peer
                                </a>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderOutgoing(requests) {
            const container = document.getElementById('outgoingContainer');
            if (requests.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-muted small">You haven't sent any exchange proposals yet.</div>`;
                return;
            }

            container.innerHTML = requests.map(r => `
                <div class="card card-custom p-3 bg-white">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2 pb-2 border-bottom border-1 border-dark">
                        <div>
                            <h6 class="mb-0 fw-bold text-dark">To: ${r.receiverName}</h6>
                            <p class="mb-0 small text-muted">Sent on ${new Date(r.createdAt).toLocaleDateString()}</p>
                        </div>
                        <span class="badge ${getStatusBadge(r.status)} px-3 py-1">${r.status}</span>
                    </div>

                    <div class="row g-2 p-2 rounded mb-2 small border border-2 border-dark" style="background-color: var(--canvas-bg);">
                        <div class="col-sm-5">
                            <span class="text-muted d-block fw-bold text-uppercase" style="font-size:0.68rem;">You Offered:</span>
                            <strong class="text-dark fs-6">${r.skillOfferedName}</strong>
                        </div>
                        <div class="col-sm-2 text-center text-dark fw-bold d-flex align-items-center justify-content-center">FOR</div>
                        <div class="col-sm-5 text-sm-end">
                            <span class="text-muted d-block fw-bold text-uppercase" style="font-size:0.68rem;">You Requested:</span>
                            <strong class="text-dark fs-6">${r.skillRequestedName}</strong>
                        </div>
                    </div>

                    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mt-2">
                        <div>
                            <span class="badge badge-${r.learningMode.toLowerCase()} me-2">Mode: ${r.learningMode}</span>
                            <span class="small text-muted fst-italic">"${r.message || 'No note added'}"</span>
                        </div>
                        <div>
                            ${r.status === 'ACCEPTED' ? `
                                <a href="chat.html?partnerId=${r.receiverId}" class="btn btn-sm btn-primary-custom">
                                    <i class="bi bi-chat-dots me-1"></i> Open Chat
                                </a>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function acceptProposal(id) {
            const res = await API.put(`/api/exchange-requests/${id}/accept`);
            if (res && res.success) {
                showAlert("Proposal accepted! You can now start communicating and scheduling sessions.", "success");
                loadRequests();
            }
        }

        async function rejectProposal(id) {
            const res = await API.put(`/api/exchange-requests/${id}/reject`);
            if (res && res.success) {
                showAlert("Proposal declined.", "info");
                loadRequests();
            }
        }

        async function completeProposal(id) {
            const res = await API.put(`/api/exchange-requests/${id}/complete`);
            if (res && res.success) {
                showAlert("Skill exchange completed! Please leave a review for your peer.", "success");
                loadRequests();
            }
        }
    </script>
</body>
</html>
