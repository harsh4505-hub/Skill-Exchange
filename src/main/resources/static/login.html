<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Student Skill Exchange Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="brand-icon-box"><i class="bi bi-arrow-left-right"></i></span>
                <span class="brand-title">Skill<strong>Exchange</strong></span>
            </a>
            <div class="ms-auto">
                <a href="register.html" class="btn btn-outline-custom btn-sm">Create Student Account</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div id="alertContainer"></div>

                <div class="card card-custom p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center border border-2 border-dark rounded mb-3 bg-light" style="width: 50px; height: 50px; box-shadow: 2px 2px 0px var(--border-color);">
                            <i class="bi bi-person-lock fs-3 text-dark"></i>
                        </div>
                        <span class="section-tag mb-1 d-inline-block">AUTHENTICATION</span>
                        <h2 class="fw-bold mb-1">WELCOME BACK</h2>
                        <p class="text-muted small">Sign in to your university peer barter dashboard</p>
                    </div>

                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label">College Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control" placeholder="student@mgmmumbai.ac.in" required>
                            </div>
                            <small class="text-muted" style="font-size: 0.75rem;">Must be an official @mgmmumbai.ac.in email</small>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label mb-0">Password <span class="text-danger">*</span></label>
                                <a href="forgot-password.html" class="small text-decoration-none fw-bold text-dark">Forgot Password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-primary-custom w-100 py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </form>

                    <!-- Quick Evaluation / Demo Logins -->
                    <div class="mt-4 pt-3 border-top border-2 border-dark">
                        <p class="text-center small text-muted fw-bold mb-2 text-uppercase" style="letter-spacing: 0.05em;">
                            <i class="bi bi-lightning-charge-fill text-warning me-1"></i>Quick 1-Click Demo Evaluation Logins
                        </p>
                        <div class="d-flex flex-wrap gap-2 justify-content-center">
                            <button type="button" class="btn btn-sm btn-outline-custom" onclick="quickFill('harsh@mgmmumbai.ac.in', 'password123')">
                                Harsh (Student)
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-custom" onclick="quickFill('sejal@mgmmumbai.ac.in', 'password123')">
                                Sejal (Student)
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-custom" onclick="quickFill('raza@mgmmumbai.ac.in', 'password123')">
                                Raza (Student)
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="quickFill('admin@mgmmumbai.ac.in', 'password123')">
                                Admin (Staff)
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <span class="text-muted small">Don't have an account yet? </span>
                        <a href="register.html" class="small fw-bold text-dark text-decoration-underline">Register student account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Check URL params for status messages
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('verified') === 'true') {
                showAlert("Your college email has been verified successfully! You can now sign in.", "success");
            } else if (params.get('passwordReset') === 'true') {
                showAlert("Your password was reset successfully. Please sign in with your new password.", "success");
            } else if (params.get('msg')) {
                showAlert(params.get('msg'), "info");
            }
            if (params.get('email')) {
                document.getElementById('email').value = params.get('email');
            }
        });

        function quickFill(email, pwd) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pwd;
            handleLogin(new Event('submit'));
        }

        async function handleLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const email = (emailInput.value || '').trim();
            const password = document.getElementById('password').value;

            // Enforce official college domain ending with @mgmmumbai.ac.in
            const collegeEmailPattern = /^[a-zA-Z0-9._%+-]+@mgmmumbai\.ac\.in$/i;
            if (!collegeEmailPattern.test(email)) {
                showAlert("Please use your official college email address ending with @mgmmumbai.ac.in.", "danger");
                emailInput.focus();
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...`;

            const res = await API.post('/api/auth/login', { email, password });
            if (res && res.success) {
                showAlert("Login successful! Redirecting...", "success");
                setTimeout(() => {
                    if (res.data.role === 'ROLE_ADMIN') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 700);
            } else {
                if (res && res.unverified) {
                    showAlert(res.message + " Redirecting to verification...", "warning");
                    setTimeout(() => {
                        window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`;
                    }, 1500);
                    return;
                }
                showAlert(res.message || "Invalid credentials. Please verify your email and password.", "danger");
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i>Sign In`;
            }
        }
    </script>
</body>
</html>
