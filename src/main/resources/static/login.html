<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Student Skill Exchange Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Authenticated Bypass: If already logged in, redirect to index.html -->
    <script>
        fetch('/api/auth/current-user', { credentials: 'include' })
            .then(r => r.json())
            .then(res => {
                if (res && res.success && res.data && res.data.authenticated) {
                    window.location.replace('index.html');
                }
            }).catch(() => {});
    </script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="landing.html">
                <span class="brand-icon-box"><i class="bi bi-arrow-left-right"></i></span>
                <span class="brand-title">Skill<strong>Exchange</strong></span>
            </a>
            <div class="ms-auto">
                <a href="register.html" class="btn btn-outline-custom btn-sm">Create Student Account</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div id="alertContainer"></div>

                <div class="card card-custom p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center border border-2 border-dark rounded mb-3 bg-light" style="width: 50px; height: 50px; box-shadow: 2px 2px 0px var(--border-color);">
                            <i class="bi bi-person-lock fs-3 text-dark"></i>
                        </div>
                        <span class="section-tag mb-1 d-inline-block">AUTHENTICATION</span>
                        <h2 class="fw-bold mb-1">WELCOME BACK</h2>
                        <p class="text-muted small">Sign in to your university peer barter dashboard</p>
                    </div>

                    <!-- 1-Click Firebase Google Sign-In -->
                    <button type="button" class="btn btn-outline-dark w-100 py-2 mb-3 fw-bold d-flex align-items-center justify-content-center shadow-sm" onclick="handleGoogleAuth(this)" style="border: 2px solid #0f172a; border-radius: 8px; background: #fff;">
                        <svg class="me-2" width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        Continue with Google
                    </button>

                    <div class="d-flex align-items-center my-3">
                        <hr class="flex-grow-1 border-secondary">
                        <span class="px-2 text-muted small fw-bold">OR SIGN IN WITH EMAIL</span>
                        <hr class="flex-grow-1 border-secondary">
                    </div>

                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control" placeholder="yourname@gmail.com" required>
                            </div>
                            <small class="text-muted" style="font-size: 0.75rem;">Any valid email (Gmail, student, or personal) is accepted</small>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label mb-0" for="password">Password <span class="text-danger">*</span></label>
                                <a href="forgot-password.html" class="small text-decoration-none fw-bold text-dark">Forgot Password?</a>
                            </div>
                            <div class="input-group position-relative">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" class="form-control password-field-input" placeholder="••••••••" required autocomplete="current-password">
                                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" aria-label="Show password" title="Show password" tabindex="0">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-primary-custom w-100 py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted small">Don't have an account yet? </span>
                        <a href="register.html" class="small fw-bold text-dark text-decoration-underline">Register student account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Check if user is already authenticated or if URL params exist
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            // If already authenticated and not explicitly logging out, redirect to Main Website / Home
            if (params.get('logout') !== 'true') {
                try {
                    const res = await API.get('/api/auth/current-user');
                    if (res && res.success && res.data && res.data.authenticated) {
                        try {
                            localStorage.setItem('landingPageVisited', 'true');
                            localStorage.setItem('se_landing_viewed', 'true');
                        } catch (e) {}
                        const userRole = res.data.role;
                        const isStaff = userRole === 'ROLE_SUPER_ADMIN' || userRole === 'SUPER_ADMIN' || userRole === 'ROLE_ADMIN' || userRole === 'ADMIN';
                        window.location.replace(isStaff ? 'admin-dashboard.html' : 'dashboard.html');
                        return;
                    }
                } catch (e) {}
            }

            if (params.get('verified') === 'true') {
                showAlert("Your college email has been verified successfully! You can now sign in.", "success");
            } else if (params.get('passwordReset') === 'true') {
                showAlert("Your password was reset successfully. Please sign in with your new password.", "success");
            } else if (params.get('msg')) {
                showAlert(params.get('msg'), "info");
            }
            if (params.get('email')) {
                document.getElementById('email').value = params.get('email');
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const email = (emailInput.value || '').trim();
            const password = passwordInput ? passwordInput.value : '';

            if (!email) {
                showAlert("Please enter your college email address.", "danger");
                emailInput.focus();
                return;
            }

            // Any valid email pattern
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                showAlert("Please enter a valid email address.", "danger");
                emailInput.focus();
                return;
            }

            if (!password) {
                showAlert("Please enter your password.", "danger");
                if (passwordInput) passwordInput.focus();
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...`;

            try {
                const res = await API.post('/api/auth/login', { email, password });
                if (res && res.success) {
                    try {
                        localStorage.setItem('skillExchangeLandingSeen', 'true');
                        localStorage.setItem('landingPageVisited', 'true');
                        localStorage.setItem('se_landing_viewed', 'true');
                        if (res.token) {
                            localStorage.setItem('se_session_token', res.token);
                        }
                    } catch (e) {}
                    showAlert("Login successful! Redirecting...", "success");
                    setTimeout(() => {
                        const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '';
                        const userRole = (res.data && res.data.role) || (res.user && res.user.role);
                        const isStaff = userRole === 'ROLE_SUPER_ADMIN' || userRole === 'SUPER_ADMIN' || userRole === 'ROLE_ADMIN' || userRole === 'ADMIN';
                        if (redirectUrl && redirectUrl !== 'index.html' && redirectUrl !== 'landing.html' && redirectUrl !== '/' && !redirectUrl.includes('landing')) {
                            window.location.href = redirectUrl;
                        } else if (isStaff) {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            // Always open Dashboard directly
                            window.location.href = 'dashboard.html';
                        }
                    }, 700);
                } else {
                    if (res && res.unverified) {
                        showAlert(res.message || "Please verify your college email before logging in. Redirecting to verification...", "warning");
                        setTimeout(() => {
                            window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`;
                        }, 1500);
                        return;
                    }
                    showAlert(res.message || "Incorrect email or password.", "danger");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i>Sign In`;
                }
            } catch (err) {
                showAlert("Unable to reach the authentication service. Please try again.", "danger");
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i>Sign In`;
            }
        }
    </script>
    <script type="module" src="js/firebase-auth.js"></script>
</body>
</html>
