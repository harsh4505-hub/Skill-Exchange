<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Student Skill Exchange Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Minimal Navbar Header -->
    <nav class="navbar navbar-custom py-3 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.svg" alt="SkillExchange MGM" class="brand-logo-img">
            </a>
            <a href="login.html" class="btn btn-outline-custom btn-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Back to Login
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div id="alertContainer"></div>

                <!-- STEP 1: Enter Email -->
                <div class="card card-custom p-4 p-md-5" id="step1Card">
                    <div class="stat-icon-box mx-auto mb-3" style="width: 54px; height: 54px; background: var(--canvas-bg);">
                        <i class="bi bi-key-fill fs-3 text-dark"></i>
                    </div>

                    <div class="text-uppercase fw-bold text-muted small text-center mb-1" style="font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em;">Account Recovery</div>
                    <h3 class="fw-bold text-center mb-2">Reset Password</h3>
                    <p class="text-muted small text-center mb-4">
                        Enter your verified college email ending with <strong>@mgmmumbai.ac.in</strong> to receive a password reset code.
                    </p>

                    <form id="forgotPasswordForm" novalidate onsubmit="handleRequestResetOtp(event)">
                        <div class="mb-3">
                            <label class="form-label" for="forgotEmail">College Email Address <span class="text-danger">*</span></label>
                            <input type="email" id="forgotEmail" class="form-control" placeholder="username@mgmmumbai.ac.in" autocomplete="email" aria-describedby="forgotEmail-error" aria-invalid="false">
                            <div class="form-text small mt-1" style="font-family: var(--font-mono); font-size: 0.72rem;">Domain policy: @mgmmumbai.ac.in only</div>
                            <div id="forgotEmail-error" class="field-error-msg" role="alert" style="display: none;"></div>
                        </div>

                        <button type="submit" id="requestResetBtn" class="btn btn-primary-custom w-100 py-2">
                            <i class="bi bi-send-fill me-1"></i> Send Password Reset Code
                        </button>
                    </form>
                </div>

                <!-- STEP 2: Enter OTP & New Password -->
                <div class="card card-custom p-4 p-md-5" id="step2Card" style="display: none;">
                    <div class="stat-icon-box mx-auto mb-3" style="width: 54px; height: 54px; background: var(--canvas-bg);">
                        <i class="bi bi-shield-lock-fill fs-3 text-dark"></i>
                    </div>

                    <div class="text-uppercase fw-bold text-muted small text-center mb-1" style="font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em;">Step 2 of 2</div>
                    <h3 class="fw-bold text-center mb-2">Create New Password</h3>
                    <p class="text-muted small text-center mb-3">
                        Enter the 6-digit code dispatched to <strong id="step2EmailDisplay" class="text-dark font-monospace"></strong> along with your new password.
                    </p>

                    <form id="resetPasswordForm" novalidate onsubmit="handleResetPassword(event)">
                        <div class="mb-3">
                            <label class="form-label" for="resetOtp">6-Digit Reset Code <span class="text-danger">*</span></label>
                            <input type="text" id="resetOtp" class="form-control font-monospace" placeholder="Enter 6-digit code" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-describedby="resetOtp-error" aria-invalid="false">
                            <div id="resetOtp-error" class="field-error-msg" role="alert" style="display: none;"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="newPassword">New Password <span class="text-danger">*</span></label>
                            <div class="password-input-wrapper position-relative">
                                <input type="password" id="newPassword" class="form-control password-field-input" placeholder="Minimum 6 characters" autocomplete="new-password" aria-describedby="newPassword-error" aria-invalid="false">
                                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('newPassword', this)" aria-label="Show new password" title="Show new password" tabindex="0">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <div id="newPassword-error" class="field-error-msg" role="alert" style="display: none;"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="confirmNewPassword">Confirm New Password <span class="text-danger">*</span></label>
                            <div class="password-input-wrapper position-relative">
                                <input type="password" id="confirmNewPassword" class="form-control password-field-input" placeholder="Re-enter new password" autocomplete="new-password" aria-describedby="confirmNewPassword-error" aria-invalid="false">
                                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmNewPassword', this)" aria-label="Show confirm new password" title="Show confirm new password" tabindex="0">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <div id="confirmNewPassword-error" class="field-error-msg" role="alert" style="display: none;"></div>
                        </div>

                        <button type="submit" id="submitResetBtn" class="btn btn-primary-custom w-100 py-2 mb-2">
                            <i class="bi bi-check2-circle me-1"></i> Update Password & Log In
                        </button>

                        <button type="button" class="btn btn-outline-custom w-100 btn-sm" onclick="backToStep1()">
                            Back to Step 1
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let resetEmail = '';
        const collegeEmailPattern = /^[a-zA-Z0-9._%+-]+@mgmmumbai\.ac\.in$/i;

        function setFieldError(fieldId, errorMsg) {
            const input = document.getElementById(fieldId);
            const errorElem = document.getElementById(`${fieldId}-error`);
            if (!input || !errorElem) return;

            if (errorMsg) {
                input.classList.add('is-invalid-field');
                input.setAttribute('aria-invalid', 'true');
                errorElem.innerText = errorMsg;
                errorElem.style.display = 'block';
            } else {
                input.classList.remove('is-invalid-field');
                input.setAttribute('aria-invalid', 'false');
                errorElem.innerText = '';
                errorElem.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const forgotEmailInput = document.getElementById('forgotEmail');
            forgotEmailInput.addEventListener('blur', () => {
                setFieldError('forgotEmail', validateForgotEmail());
            });
            forgotEmailInput.addEventListener('input', () => {
                if (forgotEmailInput.classList.contains('is-invalid-field')) {
                    setFieldError('forgotEmail', validateForgotEmail());
                }
            });

            ['resetOtp', 'newPassword', 'confirmNewPassword'].forEach(id => {
                const input = document.getElementById(id);
                input.addEventListener('blur', () => validateStep2Field(id));
                input.addEventListener('input', () => {
                    if (input.classList.contains('is-invalid-field')) {
                        validateStep2Field(id);
                    }
                });
            });
        });

        function validateForgotEmail() {
            const val = (document.getElementById('forgotEmail').value || '').trim().toLowerCase();
            if (!val) return "College email is required.";
            if (!collegeEmailPattern.test(val)) {
                return "Use your official college email ending with @mgmmumbai.ac.in.";
            }
            return null;
        }

        function validateStep2Field(id) {
            let error = null;
            if (id === 'resetOtp') {
                const val = (document.getElementById('resetOtp').value || '').trim();
                if (!val) error = "Verification code is required.";
                else if (!/^\d{6}$/.test(val)) error = "Please enter the 6-digit verification code.";
            } else if (id === 'newPassword') {
                const val = document.getElementById('newPassword').value || '';
                if (!val) error = "New password is required.";
                else if (val.length < 6) error = "Password must be at least 6 characters.";
            } else if (id === 'confirmNewPassword') {
                const pwd = document.getElementById('newPassword').value || '';
                const confirm = document.getElementById('confirmNewPassword').value || '';
                if (!confirm) error = "Please confirm your new password.";
                else if (pwd !== confirm) error = "Passwords do not match.";
            }
            setFieldError(id, error);
            return !error;
        }

        async function handleRequestResetOtp(e) {
            e.preventDefault();
            const emailErr = validateForgotEmail();
            setFieldError('forgotEmail', emailErr);
            if (emailErr) {
                document.getElementById('forgotEmail').focus();
                return;
            }

            resetEmail = document.getElementById('forgotEmail').value.trim().toLowerCase();

            const btn = document.getElementById('requestResetBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Dispatching Code...`;

            try {
                const res = await API.post('/api/auth/forgot-password', { email: resetEmail });
                if (res && res.success) {
                    showAlert("Reset code dispatched! Please check your college inbox.", "success");
                    document.getElementById('step1Card').style.display = 'none';
                    document.getElementById('step2Card').style.display = 'block';
                    document.getElementById('step2EmailDisplay').innerText = resetEmail;
                } else {
                    showAlert(res.message || "Failed to process password reset.", "danger");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="bi bi-send-fill me-1"></i> Send Password Reset Code`;
                }
            } catch (err) {
                showAlert("Error processing request. Please try again.", "danger");
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-send-fill me-1"></i> Send Password Reset Code`;
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const validOtp = validateStep2Field('resetOtp');
            const validPwd = validateStep2Field('newPassword');
            const validConfirm = validateStep2Field('confirmNewPassword');

            if (!validOtp || !validPwd || !validConfirm) {
                if (!validOtp) document.getElementById('resetOtp').focus();
                else if (!validPwd) document.getElementById('newPassword').focus();
                else document.getElementById('confirmNewPassword').focus();
                return;
            }

            const otp = document.getElementById('resetOtp').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            const btn = document.getElementById('submitResetBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Updating Password...`;

            try {
                const res = await API.post('/api/auth/reset-password', {
                    email: resetEmail,
                    otp: otp,
                    newPassword: newPassword,
                    confirmPassword: confirmNewPassword
                });

                if (res && res.success) {
                    showAlert("Password updated successfully! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = 'login.html?passwordReset=true';
                    }, 1500);
                } else {
                    showAlert(res.message || "Failed to reset password.", "danger");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="bi bi-check2-circle me-1"></i> Update Password & Log In`;
                }
            } catch (err) {
                showAlert("Error updating password. Please try again.", "danger");
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-check2-circle me-1"></i> Update Password & Log In`;
            }
        }

        function backToStep1() {
            document.getElementById('step2Card').style.display = 'none';
            document.getElementById('step1Card').style.display = 'block';
            const btn = document.getElementById('requestResetBtn');
            btn.disabled = false;
            btn.innerHTML = `<i class="bi bi-send-fill me-1"></i> Send Password Reset Code`;
        }
    </script>
</body>
</html>
