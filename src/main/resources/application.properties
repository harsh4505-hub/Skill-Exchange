# ===================================================================
# STUDENT SKILL EXCHANGE PLATFORM - APPLICATION CONFIGURATION
# 2nd Year IT College Mini Project
# ===================================================================

server.port=8080
spring.application.name=student-skill-exchange

# -------------------------------------------------------------------
# Database Configuration - MySQL (Default)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/skill_exchange_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Fallback / Offline Profile (H2 In-Memory)
# To test without running MySQL, uncomment lines below and comment MySQL:
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:skill_exchange_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# File Upload Settings (for skill verification proof documents)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/verifications

# -------------------------------------------------------------------
# Thymeleaf & Static Resources
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.web.resources.static-locations=classpath:/static/,classpath:/templates/
